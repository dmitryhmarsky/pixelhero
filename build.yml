# Собирает debug-APK в облаке GitHub: ничего ставить на свой компьютер не нужно.
# Использование: загрузите проект в репозиторий GitHub, вкладка Actions -> Build APK -> Run workflow,
# затем скачайте архив app-debug из раздела Artifacts.
name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: chmod +x ./gradlew
      - run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
